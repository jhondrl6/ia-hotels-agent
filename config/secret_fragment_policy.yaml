# Politica del barrido por FORMA DE FRAGMENTO de credencial.
#
# Que goberna: `ValidationRunner._check_no_secrets()` (scripts/run_all_validations.py, check
# [4/13]) exempta en disco los directorios de cuarentena `archives/`, `evidence/` y `.opencode/`
# porque su proposito es contener *referencias* a secretos (nombres, placeholders, instrucciones).
# La exencion dejaba sin leer la forma que si quemo este repo: el prefijo y el sufijo de una clave
# real, publicado por el viejo chequeo de configuracion como `sk-b…5a12`. Los patrones de forma
# completa (`AIzaSy{30,}`, `sk-{20,}`) no cazan un recorte: el recorte es mas corto que el patron.
#
# Que NO goberna: la forma completa. Esa sigue con su scan habitual (tracked no exento + staged +
# salidas en output/ y logs/), y este archivo no la re-escribe.
version: 1
duenio: Operador

# Directorios tracked que el scan general no lee y que ESTE barrido si recorre, con la forma de
# fragmento nada mas. Cambiar esta lista es cambiar el alcance del check.
directorios_exentos_barridos:
  - archives
  - evidence
  - .opencode

# Familias de prefijo ancladas. Se ancla en prefijo, no en la etiqueta `*_API_KEY:`, porque la
# etiqueta sola produce falsos positivos contra placeholders de guia: medido el 2026-10-11,
# `.env.template:18/21/24` (`OPENAI_API_KEY=your_o...here`) casaban con la forma etiquetada y no
# son credenciales. Un prefijo de familia si lo es.
prefijos:
  - "sk-"
  - "AIza"
  - "ghp_"
  - "gho_"
  - "ghu_"
  - "ghs_"
  - "ghr_"
  - "pplx-"

# Lo ya versionado antes de la regla. Cada entrada declara sus lineas: si el archivo gana una
# linea mas con forma de fragmento, el contador casa mal y el check va a rojo. La salida de cada
# entrada esta declarada abajo; no es un perdon permanente.
grandfathered:
  - ruta: evidence/FASE-I/faseI_run.txt
    lineas: [24, 26, 27]
    motivo: "crudo de la corrida FASE-I con el emisor viejo (prefijo+sufijo de cuatro claves)"
    duenio: Operador
    condicion_de_salida: >-
      Se retira cuando el archivo se re-escriba sin los fragmentos o se mueva al archivador
      externo de evidencia. Las tres lineas dejaron de describir una clave viva el 2026-10-11
      (la DeepSeek se roto ese dia y las dos Google ya habian rotado), medido por predicado
      contra `.env`; mientras tanto el registro no miente: describe un estado que ya no existe.
  - ruta: .opencode/context/Historico/bugs_no_onboarding_luxor_2026-07-06.md
    lineas: [95]
    motivo: "prosa de un contexto archivado que transcribe `key=AIzaSy…KJB8` de un log ajeno"
    duenio: Operador
    condicion_de_salida: >-
      No se re-escribe: es historico congelado. Su salida es que el barrido lo trate como
      conocido mientras el documento siga archivado; el fragmento no casa con ninguna clave
      actual (medido 2026-10-11).
  - ruta: logs/fase_e2e_v4complete.log
    lineas: [23, 24, 25, 26]
    motivo: "salida local (gitignored) de una corrida con el emisor ya curado en d35cb3d"
    duenio: Operador
    condicion_de_salida: >-
      Desaparece sola cuando la carpeta `logs/` se rote o se borre; no hay que purgar nada del
      historial porque el archivo nunca fue tracked.
  - ruta: evidence/FASE-P5/NR7-AC-S1-red.txt
    lineas: [10, 20]
    motivo: >-
      Crudo de una prueba en rojo: son lineas `E assert ...` que transcriben el marcador sintetico
      del propio test (`pplx-fake-...`). No describe ninguna credencial: verificado por predicado
      contra `.env` el 2026-10-11, ninguna clave viva empieza ni termina en esos fragmentos.
    duenio: Operador
    condicion_de_salida: >-
      Se retira si el crudo se regenera sin el marcador o si el test pasa a construir su marcador
      fuera de las familias ancladas. Es la entrada que el barrido encontro y el barrido manual de
      la sesion no habia visto: el alcance de esta regla no se decidio a ojo.
