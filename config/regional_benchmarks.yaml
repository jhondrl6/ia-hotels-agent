# Regional Benchmarks Configuration
# FASE-CONFIG-5: Extracción de Umbrales y Narrativas de Impacto
# FASE-P1-A: ADR sincronizado con regional_adr_2026.json (master). El campo adr aquí
# es REFERENCIAL — no se consume en cálculos financieros (ADR fluye via RegionalADRResolver).
# Versión: 1.1.0
# Fuente: v4_diagnostic_generator.py, v4_proposal_generator.py
# Uso: Centralizar thresholds de scoring y narrativas de impacto por región

version: "1.1.0"
description: "Umbrales de scoring y narrativas de impacto por región (ADR referencial, master en regional_adr_2026.json)"

default_region: "eje_cafetero"

regions:
  eje_cafetero:
    # =========================================================================
    # REGIONAL BENCHMARKS (MIN-02) — Datos de referencia del mercado hotelero
    # Fuente: Cotelco 2026, benchmarks regionales + observaciones Tier A
    # P1-A: Calibrado vs Don Alfonso ($330K), Castilla Real ($282K)
    # =========================================================================
    adr: 280000
    occupancy_rate: 0.512

    # =========================================================================
    # PAIN NARRATIVES (N-05) - Impacto porcentual por tipo de dolor
    # v4_diagnostic_generator.py L2240-2311
    # CRÍTICO: Estos valores determinan las "4 Razones" con impacto monetario
    # =========================================================================
    pain_narratives:
      no_whatsapp_visible: 0.20
      whatsapp_conflict: 0.20
      no_hotel_schema: 0.25
      low_gbp_score: 0.30
      poor_performance: 0.15
      no_faq_schema: 0.12
      no_og_tags: 0.08
      low_citability: 0.10
      ai_crawler_blocked: 0.15
      low_ia_readiness: 0.15
      no_org_schema: 0.08
      metadata_defaults: 0.10
      missing_reviews: 0.10
      no_analytics_configured: 0.10
      low_seo_score: 0.20
      low_organic_visibility: 0.10
      # FASE-B (N-A1 / S14): pesos de los pains que dejan de descartarse en silencio.
      # Derivados del estimated_impact que Capa 1 declara (high 0.20 / medium 0.10 /
      # low 0.08), no inventados. Presentes en las 4 regiones para que ninguna caiga al
      # fallback Python. Ver evidence/FASE-B/decision-pains-muertos.md §4.
      low_ota_divergence: 0.20
      missing_alt_text: 0.10
      missing_llmstxt: 0.08
      no_social_links: 0.08

    # =========================================================================
    # THRESHOLDS DE SCORING
    # =========================================================================

    # Confidence thresholds (N-02)
    # v4_proposal_generator.py L972-985
    # Determina etiquetas de calidad de assets
    confidence:
      high: 0.85
      medium: 0.70
      low: 0.40

    # GBP geo_score threshold (N-06)
    # v4_diagnostic_generator.py L1992
    # Determina pass/fail para pilar GEO
    gbp_geo_score_threshold: 70

    # Mobile score threshold (N-07)
    # v4_diagnostic_generator.py L1741
    # Determina "Adecuado" vs "Bajo" en _get_analytics_fallback
    mobile_score_threshold: 50

    # Citability thresholds (N-08)
    # v4_diagnostic_generator.py L1713-1718
    # Afecta scoring cualitativo IAO - puntos asignados
    citability:
      high: 50   # >50 = 25 puntos en _get_analytics_fallback
      low: 0     # >0 = 10 puntos

    # IAO label thresholds (N-09)
    # v4_diagnostic_generator.py L1749-1754
    # Determina etiqueta "Alta"/"Media"/"Baja"
    iao_labels:
      high: 60
      medium: 35
      # < 35 = "Baja"

    # Score status multipliers (N-10)
    # Usado para "Superior"/"Promedio" vs benchmark
    score_status:
      superior_multiplier: 1.1
      promedio_multiplier: 0.9

  # ===========================================================================
