<!-- Open Graph Meta Tags for {{hotel_name}} -->
<!-- Generated by IA Hoteles Agent -->
<!-- Created: {timestamp} -->
<!-- Inject this into your WordPress theme's header.php or SEO plugin -->

<!-- Open Graph / Facebook -->
<meta property="og:type" content="hotel" />
<meta property="og:title" content="{{hotel_name}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{url}}" />
<meta property="og:site_name" content="{{site_name}}" />
<meta property="og:locale" content="es_CO" />
<meta property="og:image" content="{{image_url}}" />
<meta property="og:image:alt" content="{{hotel_name}} - Imagen principal" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{hotel_name}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{image_url}}" />

<!-- Additional Hotel Meta Tags -->
<meta name="description" content="{{description}}" />
<meta name="rating" content="{{rating}}" />
<meta name="reviewCount" content="{{review_count}}" />
<meta name="telephone" content="{{phone}}" />
<meta name="address" content="{{address}}" />

<!-- Structured Data for Hotels -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Hotel",
  "name": "{{hotel_name}}",
  "description": "{{description}}",
  "url": "{{url}}",
  "image": "{{image_url}}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{city}}",
    "addressCountry": "CO"
  },
  "telephone": "{{phone}}",
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{rating}}",
    "reviewCount": "{{review_count}}"
  },
  "priceRange": "$"
}
</script>
