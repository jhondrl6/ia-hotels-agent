     P2 — TOP 3 ESTA SEMANA (yo solo, sin código)

     Acción: 1. Lista de 80 hoteles boutique (Maps+Booking) con teléfono, reseñas, ADR estimado
     Resultado esperado: Base de prospección priorizada por "dolor visible" (score bajo, muchas reseñas)
     Horas: 4 h
     Cómo medir: 80 filas completas con criterio de prioridad A/B/C
     ────────────────────────────────────────
     Acción: 2. PDF gancho de 2 páginas: datos del propio prospecto (v4_complete + generate_hook_pdf). Requiere correr v4_complete por cada prospecto (~5 min c/u). 20 prospectos = ~100 min de procesamiento antes de enviar el primer WhatsApp
     Resultado esperado: Asset de venta reutilizable por hotel (template fijo, datos dinámicos)
     Horas: 3 h (diseño template) + ~2 h de procesamiento por lote de 20 prospectos
     Cómo medir: Enviado a 20 prospectos; ≥25% responde
     ────────────────────────────────────────
     Acción: 3. 20 WhatsApp personalizados con dato específico del hotel ("su hotel aparece en Booking pero no responde preguntas de Google/IA"). Cada mensaje requiere v4_complete previo del hotel objetivo — el dato gancho sale del diagnóstico, no de un caso ajeno
     Resultado esperado: 5 conversaciones, 2 llamadas agendadas
     Horas: 4 h (redacción + envío) + ~100 min de v4_complete por lote de 20
     Cómo medir: Tasa respuesta ≥25%, ≥2 llamadas en calendario

     P3 — MODELO A (escalera) DESGLOSADO

     Pricing (2 tiers de entrada + recurrente):

     | Tier           | Precio COP                                       | Incluye                                                                                                             |
     |----------------|--------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|
     | Express        | $120K único                                      | Diagnóstico v4complete resumido: fuga en COP, 3 escenarios, top 5 acciones, PDF 5 pág (distinto del PDF gancho de 2 pág pre-venta). Entrega 72h                  |
     | Implementación | $2.5M único (rango $1.5-3.5M según habitaciones) | Deploy completo: JSON-LD, FAQ, llms.txt, OpenGraph, GA4, ficha Google optimizada + capacitación 1h por videollamada |
     | Seguimiento    | $400K/mes                                        | Reporte mensual "COP recuperados", ajustes de assets, monitoreo scores GEO/SEO/AEO                                  |

     Objeción principal: "Yo ya pago comisión a Booking y me llegan reservas, ¿para qué más?"
     Refutación: "Exacto — paga 15-25% por cada reserva que Booking le trae, incluso de huéspedes que lo buscaron a USTED por nombre. En un hotel de Pereira medimos $3.7M/mes en reservas que pudieron ser
     directas [caso piloto Luxorhotel, dato real del diagnóstico v4_complete — no promedio regional]. Mi trabajo no es reemplazar Booking: es que las reservas que ya son suyas no paguen peaje. El diagnóstico de $120K le dice el número exacto de SU hotel — si la fuga es menor a eso, se lo
     digo y ahí termina."

     Plantilla de propuesta (5 líneas):
     1. Su hotel pierde aprox $X COP/mes en comisiones por reservas que pudieron ser directas (dato de su diagnóstico).
     2. Implemento la corrección completa: visibilidad en Google, buscadores de IA y ficha optimizada — usted no toca nada técnico.
     3. Inversión: $2.5M única vez + $400K/mes de seguimiento con reporte de COP recuperados.
     4. Proyección conservadora: recupera la inversión en ~3 meses (caso real: ROI 2.1X en 6 meses).
     5. Si en 90 días el reporte no muestra recuperación, cancela el mensual sin penalidad.

     P4 — ROADMAP 30 DÍAS (Fase 1 completa; 6 pasos)

     1. Enviar 2ª ola de 30 WhatsApp a prospectos B/C con el PDF gancho — KPI: ≥8 respuestas.
     2. Ejecutar 2 llamadas de descubrimiento por semana con guion fijo de 20 min — KPI: 8 llamadas en el mes.
     3. Cerrar y entregar 3 Diagnósticos Express — KPI: $360K facturados, entrega ≤72h cada uno.
     4. Presentar propuesta de Implementación a cada Express entregado dentro de las 48h siguientes — KPI: 3 propuestas enviadas.
     5. Cerrar 1 Implementación con 50% de anticipo — KPI: $1.25M cobrado.
     6. Documentar el ciclo completo (mensaje→llamada→Express→propuesta) como runbook reutilizable — KPI: runbook de 1 página + tasas de conversión reales de cada etapa.